        self.__next_f.push([1, "7:[\"$\",\"$L13\",null,{\"quiz\":{\"_id\":\"cH9DwHcv9nWgReDwAWonKy\",\"description\":\"无法面对失败、情绪容易失控、拖延、完美主义、社交焦虑、习惯性自我否定——这些是很多人日常都会遇到的心理负担，程度因人而异。这份测试从六个维度帮我照出自己在这些方面的真实状态，供自我觉察参考，不是临床诊断工具；如果测试结果显示某方面的困扰已经比较明显，建议考虑寻求专业心理咨询支持。\",\"descriptionHant\":\"無法面對失敗、情緒容易失控、拖延、完美主義、社交焦慮、習慣性自我否定——這些是很多人日常都會遇到的心理負擔，程度因人而異。這份測試從六個維度幫我照出自己在這些方面的真實狀態，供自我覺察參考，不是臨牀診斷工具；如果測試結果顯示某方面的困擾已經比較明顯，建議考慮尋求專業心理諮詢支持。\",\"dimensions\":[{\"_key\":\"dim-0\",\"_type\":\"dimension\",\"color\":\"#c9845a\",\"description\":\"搞砸一件事之后，我是能相对平静地复盘总结，还是会陷入很长时间的自我否定，很难翻篇。\",\"highLabel\":\"难以承受挫败\",\"key\":\"failure_intolerance\",\"lowLabel\":\"能坦然复盘\",\"title\":\"难以面对失败\",\"titleHant\":\"難以面對失敗\"},{\"_key\":\"dim-1\",\"_type\":\"dimension\",\"color\":\"#7a9fbf\",\"description\":\"面对压力或刺激时，我的反应是大体维持理智，还是经常一下子被情绪冲昏头，事后又后悔当时的反应。\",\"highLabel\":\"容易被情绪带走\",\"key\":\"emotional_volatility\",\"lowLabel\":\"情绪总体平稳\",\"title\":\"情绪容易失控\",\"titleHant\":\"情緒容易失控\"},{\"_key\":\"dim-2\",\"_type\":\"dimension\",\"color\":\"#b85a5a\",\"description\":\"面对需要完成的任务，我是倾向于尽早开始，还是会一拖再拖，直到最后期限逼近才被迫动手。\",\"highLabel\":\"习惯性拖延\",\"key\":\"procrastination\",\"lowLabel\":\"说做就做\",\"title\":\"拖延倾向\",\"titleHant\":\"拖延傾向\"},{\"_key\":\"dim-3\",\"_type\":\"dimension\",\"color\":\"#8a7d6e\",\"description\":\"做一件事时，我能不能接受\\\"这次做到差不多就行\\\"，还是非要达到自己心里那条线才肯罢手，哪怕代价很大。\",\"highLabel\":\"苛求完美\",\"key\":\"perfectionism\",\"lowLabel\":\"能接受\\\"够好\\\"\",\"title\":\"完美主义\",\"titleHant\":\"完美主義\"},{\"_key\":\"dim-4\",\"_type\":\"dimension\",\"color\":\"#b07ab8\",\"description\":\"在需要跟人打交道的场合，我大体上能放松自然，还是常常提前就开始紧张、事后反复回想自己是不是说错了话。\",\"highLabel\":\"社交时紧张不安\",\"key\":\"social_anxiety\",\"lowLabel\":\"社交场合放松\",\"title\":\"社交焦虑\",\"titleHant\":\"社交焦慮\"},{\"_key\":\"dim-5\",\"_type\":\"dimension\",\"color\":\"#8ab87a\",\"description\":\"对自己做得不够好的地方，我是能相对客观、宽容地看待，还是习惯用很苛刻的话在心里数落自己。\",\"highLabel\":\"习惯自我否定\",\"key\":\"self_criticism\",\"lowLabel\":\"对自己较宽容\",\"title\":\"习惯自我否定\",\"titleHant\":\"習慣自我否定\"}],\"estimatedMinutes\":18,\"questions\":[{\"_key\":\"q01\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q01-a\",\"_type\":\"option\",\"text\":\"会反复回想那次失败，很长一段时间都缓不过来\",\"textHant\":\"會反覆回想那次失敗，很長一段時間都緩不過來\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q01-b\",\"_type\":\"option\",\"text\":\"想起来还会突然情绪上涌，可能对着不相关的人发脾气\",\"textHant\":\"想起來還會突然情緒上湧，可能對着不相關的人發脾氣\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q01-c\",\"_type\":\"option\",\"text\":\"会先把这件事往后拖一拖，不太想立刻面对后续要处理的事\",\"textHant\":\"會先把這件事往後拖一拖，不太想立刻面對後續要處理的事\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q01-d\",\"_type\":\"option\",\"text\":\"会忍不住反复琢磨\\\"如果当时做得更完美会不会不一样\\\"\",\"textHant\":\"會忍不住反覆琢磨\\\"如果當時做得更完美會不會不一樣\\\"\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q01-e\",\"_type\":\"option\",\"text\":\"会担心别人已经知道了这件事，不敢在人前提起\",\"textHant\":\"會擔心別人已經知道了這件事，不敢在人前提起\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q01-f\",\"_type\":\"option\",\"text\":\"心里会有个声音一直说\\\"看吧，你就是不行\\\"\",\"textHant\":\"心裏會有個聲音一直說\\\"看吧，你就是不行\\\"\",\"weights\":\"0,0,0,0,0,3\"}],\"section\":\"面对失败\",\"text\":\"一件我很在意的事情最后搞砸了，接下来几天我通常是什么状态？\",\"textHant\":\"一件我很在意的事情最後搞砸了，接下來幾天我通常是什麼狀態？\"},{\"_key\":\"q02\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q02-a\",\"_type\":\"option\",\"text\":\"当场情绪会很激动，可能语气或表情都藏不住\",\"textHant\":\"當場情緒會很激動，可能語氣或表情都藏不住\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q02-b\",\"_type\":\"option\",\"text\":\"想到要去跟人解释这件事，会先拖一拖再说\",\"textHant\":\"想到要去跟人解釋這件事，會先拖一拖再說\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q02-c\",\"_type\":\"option\",\"text\":\"会想着\\\"必须找到一个完美的补救方案\\\"，哪怕来不及也要试\",\"textHant\":\"會想着\\\"必須找到一個完美的補救方案\\\"，哪怕來不及也要試\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q02-d\",\"_type\":\"option\",\"text\":\"最怕的不是问题本身，而是要在同事面前承认这件事\",\"textHant\":\"最怕的不是問題本身，而是要在同事面前承認這件事\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q02-e\",\"_type\":\"option\",\"text\":\"会立刻在心里给自己贴上\\\"我果然做不好事\\\"的标签\",\"textHant\":\"會立刻在心裏給自己貼上\\\"我果然做不好事\\\"的標籤\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q02-f\",\"_type\":\"option\",\"text\":\"很难承认\\\"我确实搞砸了\\\"这个事实，会想各种理由说服自己不是那么严重\",\"textHant\":\"很難承認\\\"我確實搞砸了\\\"這個事實，會想各種理由說服自己不是那麼嚴重\",\"weights\":\"3,0,0,0,0,0\"}],\"section\":\"面对失败\",\"text\":\"如果一个重要项目因为我的失误出了问题，我的第一反应通常是？\",\"textHant\":\"如果一個重要項目因爲我的失誤出了問題，我的第一反應通常是？\"},{\"_key\":\"q03\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q03-a\",\"_type\":\"option\",\"text\":\"会觉得\\\"这件事我一直没真正处理过\\\"，但也没打算现在去处理\",\"textHant\":\"會覺得\\\"這件事我一直沒真正處理過\\\"，但也沒打算現在去處理\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q03-b\",\"_type\":\"option\",\"text\":\"会想\\\"当时要是再多准备一点就不会这样\\\"，反复设想更好的版本\",\"textHant\":\"會想\\\"當時要是再多準備一點就不會這樣\\\"，反覆設想更好的版本\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q03-c\",\"_type\":\"option\",\"text\":\"会担心别人是不是还记得那次我出丑的样子\",\"textHant\":\"會擔心別人是不是還記得那次我出醜的樣子\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q03-d\",\"_type\":\"option\",\"text\":\"会觉得那次失败某种程度上证明了自己本来就不够好\",\"textHant\":\"會覺得那次失敗某種程度上證明了自己本來就不夠好\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q03-e\",\"_type\":\"option\",\"text\":\"有些事到现在想起来还是会心里一沉，感觉像刚发生一样\",\"textHant\":\"有些事到現在想起來還是會心裏一沉，感覺像剛發生一樣\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q03-f\",\"_type\":\"option\",\"text\":\"想起来时情绪会突然变得低落或烦躁，自己都觉得有点没来由\",\"textHant\":\"想起來時情緒會突然變得低落或煩躁，自己都覺得有點沒來由\",\"weights\":\"0,3,0,0,0,0\"}],\"section\":\"面对失败\",\"text\":\"过去做错过的一些事，现在偶尔想起来，我通常是什么感觉？\",\"textHant\":\"過去做錯過的一些事，現在偶爾想起來，我通常是什麼感覺？\"},{\"_key\":\"q04\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q04-a\",\"_type\":\"option\",\"text\":\"会觉得这次没做到最好，比错误本身更让我难受\",\"textHant\":\"會覺得這次沒做到最好，比錯誤本身更讓我難受\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q04-b\",\"_type\":\"option\",\"text\":\"最怕的是这件事让对方从此觉得我能力不行\",\"textHant\":\"最怕的是這件事讓對方從此覺得我能力不行\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q04-c\",\"_type\":\"option\",\"text\":\"会立刻觉得\\\"这说明我这个人本来就有问题\\\"\",\"textHant\":\"會立刻覺得\\\"這說明我這個人本來就有問題\\\"\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q04-d\",\"_type\":\"option\",\"text\":\"那种被指出错误的感觉会在我心里停留很久，很难说过去就过去了\",\"textHant\":\"那種被指出錯誤的感覺會在我心裏停留很久，很難說過去就過去了\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q04-e\",\"_type\":\"option\",\"text\":\"当下会觉得脸上发烫，情绪很难维持平静\",\"textHant\":\"當下會覺得臉上發燙，情緒很難維持平靜\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q04-f\",\"_type\":\"option\",\"text\":\"会先应付过去，真正去改的动作会拖很久\",\"textHant\":\"會先應付過去，真正去改的動作會拖很久\",\"weights\":\"0,0,3,0,0,0\"}],\"section\":\"面对失败\",\"text\":\"被上级或长辈当面指出一个明显的错误，我通常会？\",\"textHant\":\"被上級或長輩當面指出一個明顯的錯誤，我通常會？\"},{\"_key\":\"q05\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q05-a\",\"_type\":\"option\",\"text\":\"比起复盘内容，我更在意别人会不会觉得我这次很丢人\",\"textHant\":\"比起復盤內容，我更在意別人會不會覺得我這次很丟人\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q05-b\",\"_type\":\"option\",\"text\":\"复盘经常变成一场自我批判，很少客观分析具体原因\",\"textHant\":\"覆盤經常變成一場自我批判，很少客觀分析具體原因\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q05-c\",\"_type\":\"option\",\"text\":\"很难心平气和地复盘，一想起来就还是很难受\",\"textHant\":\"很難心平氣和地覆盤，一想起來就還是很難受\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q05-d\",\"_type\":\"option\",\"text\":\"复盘的时候情绪很容易上头，很难冷静分析原因\",\"textHant\":\"覆盤的時候情緒很容易上頭，很難冷靜分析原因\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q05-e\",\"_type\":\"option\",\"text\":\"知道应该复盘，但实际动手去做通常会拖很久\",\"textHant\":\"知道應該覆盤，但實際動手去做通常會拖很久\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q05-f\",\"_type\":\"option\",\"text\":\"复盘时会揪着自己没做到完美的细节不放，反而看不到整体表现\",\"textHant\":\"覆盤時會揪着自己沒做到完美的細節不放，反而看不到整體表現\",\"weights\":\"0,0,0,3,0,0\"}],\"section\":\"面对失败\",\"text\":\"一次考试、面试或考核发挥不好，我事后复盘的方式通常是？\",\"textHant\":\"一次考試、面試或考覈發揮不好，我事後覆盤的方式通常是？\"},{\"_key\":\"q06\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q06-a\",\"_type\":\"option\",\"text\":\"会立刻觉得\\\"是不是我又搞砸了什么\\\"\",\"textHant\":\"會立刻覺得\\\"是不是我又搞砸了什麼\\\"\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q06-b\",\"_type\":\"option\",\"text\":\"会立刻联想到自己以前类似的失败经历，情绪一下被拖下去\",\"textHant\":\"會立刻聯想到自己以前類似的失敗經歷，情緒一下被拖下去\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q06-c\",\"_type\":\"option\",\"text\":\"当场情绪会明显失控，可能语无伦次或者情绪激动\",\"textHant\":\"當場情緒會明顯失控，可能語無倫次或者情緒激動\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q06-d\",\"_type\":\"option\",\"text\":\"心里会想\\\"等一下再处理\\\"，先逃避一会儿\",\"textHant\":\"心裏會想\\\"等一下再處理\\\"，先逃避一會兒\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q06-e\",\"_type\":\"option\",\"text\":\"会立刻想\\\"必须马上找到一个完美的应对方式\\\"，反而更慌\",\"textHant\":\"會立刻想\\\"必須馬上找到一個完美的應對方式\\\"，反而更慌\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q06-f\",\"_type\":\"option\",\"text\":\"第一反应是担心别人看到我慌乱的样子\",\"textHant\":\"第一反應是擔心別人看到我慌亂的樣子\",\"weights\":\"0,0,0,0,3,0\"}],\"section\":\"情绪与压力\",\"text\":\"突然遇到一件让我措手不及的坏消息，我的反应通常是？\",\"textHant\":\"突然遇到一件讓我措手不及的壞消息，我的反應通常是？\"},{\"_key\":\"q07\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q07-a\",\"_type\":\"option\",\"text\":\"会反复回想争执的细节，好几天都放不下\",\"textHant\":\"會反覆回想爭執的細節，好幾天都放不下\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q07-b\",\"_type\":\"option\",\"text\":\"当场情绪很激烈，说话可能会比平时冲很多\",\"textHant\":\"當場情緒很激烈，說話可能會比平時衝很多\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q07-c\",\"_type\":\"option\",\"text\":\"平复的方式经常是先拖着不去想，而不是主动处理\",\"textHant\":\"平復的方式經常是先拖着不去想，而不是主動處理\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q07-d\",\"_type\":\"option\",\"text\":\"会反复琢磨自己当时哪句话说得不够好、不够漂亮\",\"textHant\":\"會反覆琢磨自己當時哪句話說得不夠好、不夠漂亮\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q07-e\",\"_type\":\"option\",\"text\":\"比起争执本身，我更担心对方是不是从此对我有看法\",\"textHant\":\"比起爭執本身，我更擔心對方是不是從此對我有看法\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q07-f\",\"_type\":\"option\",\"text\":\"事后会觉得这次争执又证明了自己脾气不好、性格有问题\",\"textHant\":\"事後會覺得這次爭執又證明了自己脾氣不好、性格有問題\",\"weights\":\"0,0,0,0,0,3\"}],\"section\":\"情绪与压力\",\"text\":\"跟人发生争执之后，我通常需要多久才能真正平复下来？\",\"textHant\":\"跟人發生爭執之後，我通常需要多久才能真正平復下來？\"},{\"_key\":\"q08\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q08-a\",\"_type\":\"option\",\"text\":\"容易情绪一下子涌上来，做出一些事后觉得没必要的反应\",\"textHant\":\"容易情緒一下子湧上來，做出一些事後覺得沒必要的反應\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q08-b\",\"_type\":\"option\",\"text\":\"会先把要处理的事放一放，用别的事情分散注意力\",\"textHant\":\"會先把要處理的事放一放，用別的事情分散注意力\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q08-c\",\"_type\":\"option\",\"text\":\"会给自己定一个很高的标准，觉得必须完美应对才算过关\",\"textHant\":\"會給自己定一個很高的標準，覺得必須完美應對纔算過關\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q08-d\",\"_type\":\"option\",\"text\":\"会担心别人看出我压力很大，尽量不表现出来\",\"textHant\":\"會擔心別人看出我壓力很大，儘量不表現出來\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q08-e\",\"_type\":\"option\",\"text\":\"压力大的时候特别容易开始否定自己整个人\",\"textHant\":\"壓力大的時候特別容易開始否定自己整個人\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q08-f\",\"_type\":\"option\",\"text\":\"很容易联想到过去处理不好的类似情况，越想压力越大\",\"textHant\":\"很容易聯想到過去處理不好的類似情況，越想壓力越大\",\"weights\":\"3,0,0,0,0,0\"}],\"section\":\"情绪与压力\",\"text\":\"压力大的时候，我处理情绪的方式通常是？\",\"textHant\":\"壓力大的時候，我處理情緒的方式通常是？\"},{\"_key\":\"q09\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q09-a\",\"_type\":\"option\",\"text\":\"会想着\\\"晚点再面对这个结果\\\"，先放一放\",\"textHant\":\"會想着\\\"晚點再面對這個結果\\\"，先放一放\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q09-b\",\"_type\":\"option\",\"text\":\"会觉得没达到预期本身就说明自己不够努力、不够好\",\"textHant\":\"會覺得沒達到預期本身就說明自己不夠努力、不夠好\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q09-c\",\"_type\":\"option\",\"text\":\"会担心这个结果让别人对我的印象打了折扣\",\"textHant\":\"會擔心這個結果讓別人對我的印象打了折扣\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q09-d\",\"_type\":\"option\",\"text\":\"会不自觉地把这件事归结为自己能力有问题\",\"textHant\":\"會不自覺地把這件事歸結爲自己能力有問題\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q09-e\",\"_type\":\"option\",\"text\":\"会觉得这又是一次不该发生的失败，久久不能释怀\",\"textHant\":\"會覺得這又是一次不該發生的失敗，久久不能釋懷\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q09-f\",\"_type\":\"option\",\"text\":\"会有比较明显的情绪波动，比如烦躁、低落或易怒\",\"textHant\":\"會有比較明顯的情緒波動，比如煩躁、低落或易怒\",\"weights\":\"0,3,0,0,0,0\"}],\"section\":\"情绪与压力\",\"text\":\"一件事的结果没有达到我的预期，我的情绪反应通常是？\",\"textHant\":\"一件事的結果沒有達到我的預期，我的情緒反應通常是？\"},{\"_key\":\"q10\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q10-a\",\"_type\":\"option\",\"text\":\"会因为这一天没有一件事做到完美而觉得整天都很失败\",\"textHant\":\"會因爲這一天沒有一件事做到完美而覺得整天都很失敗\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q10-b\",\"_type\":\"option\",\"text\":\"会开始担心自己这种状态会不会被别人看出来\",\"textHant\":\"會開始擔心自己這種狀態會不會被別人看出來\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q10-c\",\"_type\":\"option\",\"text\":\"会觉得\\\"为什么倒霉的总是我\\\"，开始怀疑自己\",\"textHant\":\"會覺得\\\"爲什麼倒黴的總是我\\\"，開始懷疑自己\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q10-d\",\"_type\":\"option\",\"text\":\"会把当天所有不顺心的事叠加在一起反复想，越想越低落\",\"textHant\":\"會把當天所有不順心的事疊加在一起反覆想，越想越低落\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q10-e\",\"_type\":\"option\",\"text\":\"情绪会明显比平时更容易被点燃，一点小事就可能爆发\",\"textHant\":\"情緒會明顯比平時更容易被點燃，一點小事就可能爆發\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q10-f\",\"_type\":\"option\",\"text\":\"会觉得已经很累了，那些本该处理的事情就先放着\",\"textHant\":\"會覺得已經很累了，那些本該處理的事情就先放着\",\"weights\":\"0,0,3,0,0,0\"}],\"section\":\"情绪与压力\",\"text\":\"如果一天当中同时发生好几件不顺心的事，我到了晚上通常是什么状态？\",\"textHant\":\"如果一天當中同時發生好幾件不順心的事，我到了晚上通常是什麼狀態？\"},{\"_key\":\"q11\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q11-a\",\"_type\":\"option\",\"text\":\"会担心做不好被人看到，索性先拖着不开始\",\"textHant\":\"會擔心做不好被人看到，索性先拖着不開始\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q11-b\",\"_type\":\"option\",\"text\":\"还没开始就先觉得\\\"我大概率又做不好\\\"，干脆先不动\",\"textHant\":\"還沒開始就先覺得\\\"我大概率又做不好\\\"，乾脆先不動\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q11-c\",\"_type\":\"option\",\"text\":\"一想到之前类似任务没做好，就更不想开始这次的\",\"textHant\":\"一想到之前類似任務沒做好，就更不想開始這次的\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q11-d\",\"_type\":\"option\",\"text\":\"心里会先烦躁一阵，情绪上先抵触，行动上也跟着拖\",\"textHant\":\"心裏會先煩躁一陣，情緒上先牴觸，行動上也跟着拖\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q11-e\",\"_type\":\"option\",\"text\":\"会先做点别的事情，把这个任务往后放\",\"textHant\":\"會先做點別的事情，把這個任務往後放\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q11-f\",\"_type\":\"option\",\"text\":\"会因为想不出一个完美的开头，迟迟不敢真正动手\",\"textHant\":\"會因爲想不出一個完美的開頭，遲遲不敢真正動手\",\"weights\":\"0,0,0,3,0,0\"}],\"section\":\"拖延与执行\",\"text\":\"接到一个不太想做但必须完成的任务，我通常会？\",\"textHant\":\"接到一個不太想做但必須完成的任務，我通常會？\"},{\"_key\":\"q12\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q12-a\",\"_type\":\"option\",\"text\":\"临近截止日期会开始否定自己整个项目的价值\",\"textHant\":\"臨近截止日期會開始否定自己整個項目的價值\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q12-b\",\"_type\":\"option\",\"text\":\"会想起以前也是这样临时抱佛脚结果搞砸的经历，越想越焦虑\",\"textHant\":\"會想起以前也是這樣臨時抱佛腳結果搞砸的經歷，越想越焦慮\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q12-c\",\"_type\":\"option\",\"text\":\"临近截止日期时情绪会明显紧绷，容易对自己或别人发火\",\"textHant\":\"臨近截止日期時情緒會明顯緊繃，容易對自己或別人發火\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q12-d\",\"_type\":\"option\",\"text\":\"前面大部分时间基本都在拖，真正的推进都堆在最后\",\"textHant\":\"前面大部分時間基本都在拖，真正的推進都堆在最後\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q12-e\",\"_type\":\"option\",\"text\":\"哪怕时间紧张，也还是想把每个细节都做到位，宁愿熬夜\",\"textHant\":\"哪怕時間緊張，也還是想把每個細節都做到位，寧願熬夜\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q12-f\",\"_type\":\"option\",\"text\":\"担心到时候交出来的东西不够好，让人觉得我不专业\",\"textHant\":\"擔心到時候交出來的東西不夠好，讓人覺得我不專業\",\"weights\":\"0,0,0,0,3,0\"}],\"section\":\"拖延与执行\",\"text\":\"一个长期项目临近截止日期，我的状态通常是？\",\"textHant\":\"一個長期項目臨近截止日期，我的狀態通常是？\"},{\"_key\":\"q13\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q13-a\",\"_type\":\"option\",\"text\":\"因为怕写不好又要重来一次，迟迟不敢真正下笔\",\"textHant\":\"因爲怕寫不好又要重來一次，遲遲不敢真正下筆\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q13-b\",\"_type\":\"option\",\"text\":\"开始写之前情绪会有点烦躁，容易找各种理由拖延\",\"textHant\":\"開始寫之前情緒會有點煩躁，容易找各種理由拖延\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q13-c\",\"_type\":\"option\",\"text\":\"基本要等到没有退路了才会真正坐下来写\",\"textHant\":\"基本要等到沒有退路了纔會真正坐下來寫\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q13-d\",\"_type\":\"option\",\"text\":\"会一直卡在开头那几句，想不到完美的表达就不往下写\",\"textHant\":\"會一直卡在開頭那幾句，想不到完美的表達就不往下寫\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q13-e\",\"_type\":\"option\",\"text\":\"会担心写出来的东西被别人评价不好，所以迟迟不定稿\",\"textHant\":\"會擔心寫出來的東西被別人評價不好，所以遲遲不定稿\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q13-f\",\"_type\":\"option\",\"text\":\"写之前心里已经预设\\\"这次多半又写不好\\\"\",\"textHant\":\"寫之前心裏已經預設\\\"這次多半又寫不好\\\"\",\"weights\":\"0,0,0,0,0,3\"}],\"section\":\"拖延与执行\",\"text\":\"写一份重要的报告或文案，我通常什么时候会真正开始动笔？\",\"textHant\":\"寫一份重要的報告或文案，我通常什麼時候會真正開始動筆？\"},{\"_key\":\"q14\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q14-a\",\"_type\":\"option\",\"text\":\"执行不下去的时候会突然情绪低落甚至有点自责的爆发\",\"textHant\":\"執行不下去的時候會突然情緒低落甚至有點自責的爆發\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q14-b\",\"_type\":\"option\",\"text\":\"会告诉自己\\\"明天开始也一样\\\"，一拖就是很久\",\"textHant\":\"會告訴自己\\\"明天開始也一樣\\\"，一拖就是很久\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q14-c\",\"_type\":\"option\",\"text\":\"会觉得要么就做到完美执行要么干脆不做，中间状态很难接受\",\"textHant\":\"會覺得要麼就做到完美執行要麼乾脆不做，中間狀態很難接受\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q14-d\",\"_type\":\"option\",\"text\":\"会担心被人知道自己计划又没做到，索性不跟人提\",\"textHant\":\"會擔心被人知道自己計劃又沒做到，索性不跟人提\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q14-e\",\"_type\":\"option\",\"text\":\"每次执行不下去都会觉得又一次证明自己是个说话不算数的人\",\"textHant\":\"每次執行不下去都會覺得又一次證明自己是個說話不算數的人\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q14-f\",\"_type\":\"option\",\"text\":\"会想起之前很多次计划也没坚持下来，越想越没信心开始\",\"textHant\":\"會想起之前很多次計劃也沒堅持下來，越想越沒信心開始\",\"weights\":\"3,0,0,0,0,0\"}],\"section\":\"拖延与执行\",\"text\":\"定好的计划（比如运动、学习、整理房间）经常执行不下去，我通常怎么看这件事？\",\"textHant\":\"定好的計劃（比如運動、學習、整理房間）經常執行不下去，我通常怎麼看這件事？\"},{\"_key\":\"q15\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q15-a\",\"_type\":\"option\",\"text\":\"会先找各种借口把这件事排到最后再做\",\"textHant\":\"會先找各種藉口把這件事排到最後再做\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q15-b\",\"_type\":\"option\",\"text\":\"会因为一开始想不出最好的方法，干脆先不动手\",\"textHant\":\"會因爲一開始想不出最好的方法，乾脆先不動手\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q15-c\",\"_type\":\"option\",\"text\":\"会担心自己做得不好被人看见，尽量拖到不得不做\",\"textHant\":\"會擔心自己做得不好被人看見，儘量拖到不得不做\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q15-d\",\"_type\":\"option\",\"text\":\"开始之前心里已经默认\\\"这件事我大概率做不好\\\"\",\"textHant\":\"開始之前心裏已經默認\\\"這件事我大概率做不好\\\"\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q15-e\",\"_type\":\"option\",\"text\":\"会先想到以前做不好类似事情的经历，迟迟不敢开始\",\"textHant\":\"會先想到以前做不好類似事情的經歷，遲遲不敢開始\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q15-f\",\"_type\":\"option\",\"text\":\"一想到要做这件事就会烦躁，这种情绪会拖慢开始的速度\",\"textHant\":\"一想到要做這件事就會煩躁，這種情緒會拖慢開始的速度\",\"weights\":\"0,3,0,0,0,0\"}],\"section\":\"拖延与执行\",\"text\":\"面对一件我不擅长但必须做的事，我通常怎么开始？\",\"textHant\":\"面對一件我不擅長但必須做的事，我通常怎麼開始？\"},{\"_key\":\"q16\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q16-a\",\"_type\":\"option\",\"text\":\"会反反复复修改，很难说\\\"这样已经够好了，可以收尾\\\"\",\"textHant\":\"會反反覆覆修改，很難說\\\"這樣已經夠好了，可以收尾\\\"\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q16-b\",\"_type\":\"option\",\"text\":\"交出去之前会担心别人挑出里面的问题\",\"textHant\":\"交出去之前會擔心別人挑出裏面的問題\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q16-c\",\"_type\":\"option\",\"text\":\"会觉得没做到完美就等于这次又没做好\",\"textHant\":\"會覺得沒做到完美就等於這次又沒做好\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q16-d\",\"_type\":\"option\",\"text\":\"哪怕已经过去很久，只要想起里面的不足还是会耿耿于怀\",\"textHant\":\"哪怕已經過去很久，只要想起裏面的不足還是會耿耿於懷\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q16-e\",\"_type\":\"option\",\"text\":\"看到不满意的地方，情绪会突然变得烦躁\",\"textHant\":\"看到不滿意的地方，情緒會突然變得煩躁\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q16-f\",\"_type\":\"option\",\"text\":\"知道该改进，但真正动手修改会拖很久\",\"textHant\":\"知道該改進，但真正動手修改會拖很久\",\"weights\":\"0,0,3,0,0,0\"}],\"section\":\"完美主义\",\"text\":\"一份已经完成的作品或文件，我通常还会怎么对待？\",\"textHant\":\"一份已經完成的作品或文件，我通常還會怎麼對待？\"},{\"_key\":\"q17\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q17-a\",\"_type\":\"option\",\"text\":\"会担心万一被别人看出瑕疵，这份夸奖就站不住了\",\"textHant\":\"會擔心萬一被別人看出瑕疵，這份誇獎就站不住了\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q17-b\",\"_type\":\"option\",\"text\":\"心里会觉得\\\"他们只是没看出来我做得不够好\\\"\",\"textHant\":\"心裏會覺得\\\"他們只是沒看出來我做得不夠好\\\"\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q17-c\",\"_type\":\"option\",\"text\":\"心里还是会想起以前没做好的类似经历，不太敢真的相信这次夸奖\",\"textHant\":\"心裏還是會想起以前沒做好的類似經歷，不太敢真的相信這次誇獎\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q17-d\",\"_type\":\"option\",\"text\":\"嘴上说谢谢，但心里其实有点烦躁，觉得对方没看到问题\",\"textHant\":\"嘴上說謝謝，但心裏其實有點煩躁，覺得對方沒看到問題\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q17-e\",\"_type\":\"option\",\"text\":\"会想着以后再找时间去改那些瑕疵，但通常不会马上做\",\"textHant\":\"會想着以後再找時間去改那些瑕疵，但通常不會馬上做\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q17-f\",\"_type\":\"option\",\"text\":\"很难真正接受这个夸奖，脑子里全是那些没做到位的细节\",\"textHant\":\"很難真正接受這個誇獎，腦子裏全是那些沒做到位的細節\",\"weights\":\"0,0,0,3,0,0\"}],\"section\":\"完美主义\",\"text\":\"别人夸我这次做得不错，但我自己心里知道还有瑕疵，我的反应通常是？\",\"textHant\":\"別人誇我這次做得不錯，但我自己心裏知道還有瑕疵，我的反應通常是？\"},{\"_key\":\"q18\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q18-a\",\"_type\":\"option\",\"text\":\"有时候反而会先反思是不是自己没交代清楚，陷入自我怀疑\",\"textHant\":\"有時候反而會先反思是不是自己沒交代清楚，陷入自我懷疑\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q18-b\",\"_type\":\"option\",\"text\":\"会忍不住想起以前类似的合作也出过问题，心里先有阴影\",\"textHant\":\"會忍不住想起以前類似的合作也出過問題，心裏先有陰影\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q18-c\",\"_type\":\"option\",\"text\":\"当场情绪会比较明显，可能语气会不自觉变得急躁\",\"textHant\":\"當場情緒會比較明顯，可能語氣會不自覺變得急躁\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q18-d\",\"_type\":\"option\",\"text\":\"会想着之后找时间沟通，但实际开口会拖一拖\",\"textHant\":\"會想着之後找時間溝通，但實際開口會拖一拖\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q18-e\",\"_type\":\"option\",\"text\":\"会忍不住想自己重新做一遍，觉得只有这样才放心\",\"textHant\":\"會忍不住想自己重新做一遍，覺得只有這樣才放心\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q18-f\",\"_type\":\"option\",\"text\":\"会担心如果不管这件事，最终成果不好会连累自己的名声\",\"textHant\":\"會擔心如果不管這件事，最終成果不好會連累自己的名聲\",\"weights\":\"0,0,0,0,3,0\"}],\"section\":\"完美主义\",\"text\":\"团队合作时，如果别人负责的部分没有达到我心里的标准，我通常怎么处理？\",\"textHant\":\"團隊合作時，如果別人負責的部分沒有達到我心裏的標準，我通常怎麼處理？\"},{\"_key\":\"q19\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q19-a\",\"_type\":\"option\",\"text\":\"会想起以前\\\"做得不够好\\\"的经历，更加不甘心这次也这样交出去\",\"textHant\":\"會想起以前\\\"做得不夠好\\\"的經歷，更加不甘心這次也這樣交出去\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q19-b\",\"_type\":\"option\",\"text\":\"交出去之前情绪会比较烦躁，觉得很不舒服\",\"textHant\":\"交出去之前情緒會比較煩躁，覺得很不舒服\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q19-c\",\"_type\":\"option\",\"text\":\"会想办法拖一拖时间，哪怕明知道拖不了多久\",\"textHant\":\"會想辦法拖一拖時間，哪怕明知道拖不了多久\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q19-d\",\"_type\":\"option\",\"text\":\"心里会很不舒服，很难说服自己\\\"这次这样也可以\\\"\",\"textHant\":\"心裏會很不舒服，很難說服自己\\\"這次這樣也可以\\\"\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q19-e\",\"_type\":\"option\",\"text\":\"会担心别人看到这个\\\"没做完\\\"的版本会怎么评价我\",\"textHant\":\"會擔心別人看到這個\\\"沒做完\\\"的版本會怎麼評價我\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q19-f\",\"_type\":\"option\",\"text\":\"会觉得没做到最好本身就是一种失败\",\"textHant\":\"會覺得沒做到最好本身就是一種失敗\",\"weights\":\"0,0,0,0,0,3\"}],\"section\":\"完美主义\",\"text\":\"如果时间有限，只能把一件事做到七八十分交出去，我的感受通常是？\",\"textHant\":\"如果時間有限，只能把一件事做到七八十分交出去，我的感受通常是？\"},{\"_key\":\"q20\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q20-a\",\"_type\":\"option\",\"text\":\"纠结到一定程度会突然觉得很烦躁，甚至有点上火\",\"textHant\":\"糾結到一定程度會突然覺得很煩躁，甚至有點上火\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q20-b\",\"_type\":\"option\",\"text\":\"会拖到最后一刻才勉强定下来\",\"textHant\":\"會拖到最後一刻才勉強定下來\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q20-c\",\"_type\":\"option\",\"text\":\"会反复对比、修改很多版本，直到觉得\\\"这个够好了\\\"才罢休\",\"textHant\":\"會反覆對比、修改很多版本，直到覺得\\\"這個夠好了\\\"才罷休\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q20-d\",\"_type\":\"option\",\"text\":\"会很在意对方收到后的反应，担心显得不够走心\",\"textHant\":\"會很在意對方收到後的反應，擔心顯得不夠走心\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q20-e\",\"_type\":\"option\",\"text\":\"选不好的时候会觉得\\\"我连这点小事都办不好\\\"\",\"textHant\":\"選不好的時候會覺得\\\"我連這點小事都辦不好\\\"\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q20-f\",\"_type\":\"option\",\"text\":\"会想起以前送礼被人觉得不够用心的经历，这次更加纠结\",\"textHant\":\"會想起以前送禮被人覺得不夠用心的經歷，這次更加糾結\",\"weights\":\"3,0,0,0,0,0\"}],\"section\":\"完美主义\",\"text\":\"选择一份礼物、写一段祝福语这种\\\"小事\\\"，我通常花多长时间纠结？\",\"textHant\":\"選擇一份禮物、寫一段祝福語這種\\\"小事\\\"，我通常花多長時間糾結？\"},{\"_key\":\"q21\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q21-a\",\"_type\":\"option\",\"text\":\"会想办法尽量拖延轮到自己的时间\",\"textHant\":\"會想辦法儘量拖延輪到自己的時間\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q21-b\",\"_type\":\"option\",\"text\":\"会提前反复练习，怕说得不够完美会被人记住\",\"textHant\":\"會提前反覆練習，怕說得不夠完美會被人記住\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q21-c\",\"_type\":\"option\",\"text\":\"整个过程最担心的就是别人怎么看我\",\"textHant\":\"整個過程最擔心的就是別人怎麼看我\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q21-d\",\"_type\":\"option\",\"text\":\"说完之后会立刻开始反复检讨自己哪里说得不好\",\"textHant\":\"說完之後會立刻開始反覆檢討自己哪裏說得不好\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q21-e\",\"_type\":\"option\",\"text\":\"会想起以前发言出丑的经历，这次更紧张\",\"textHant\":\"會想起以前發言出醜的經歷，這次更緊張\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q21-f\",\"_type\":\"option\",\"text\":\"开口前情绪会明显紧绷，甚至声音会不自觉发抖\",\"textHant\":\"開口前情緒會明顯緊繃，甚至聲音會不自覺發抖\",\"weights\":\"0,3,0,0,0,0\"}],\"section\":\"社交场合\",\"text\":\"要在一个不太熟的场合做自我介绍或发言，我通常是什么状态？\",\"textHant\":\"要在一個不太熟的場合做自我介紹或發言，我通常是什麼狀態？\"},{\"_key\":\"q22\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q22-a\",\"_type\":\"option\",\"text\":\"会提前想好该说什么、怎么表现才不会失礼\",\"textHant\":\"會提前想好該說什麼、怎麼表現纔不會失禮\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q22-b\",\"_type\":\"option\",\"text\":\"整场基本都在观察别人是不是在评价我\",\"textHant\":\"整場基本都在觀察別人是不是在評價我\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q22-c\",\"_type\":\"option\",\"text\":\"结束后会反复回想自己有没有哪句话说得很尴尬\",\"textHant\":\"結束後會反覆回想自己有沒有哪句話說得很尷尬\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q22-d\",\"_type\":\"option\",\"text\":\"会想起以前类似场合的不自在，还没到就先有点抵触\",\"textHant\":\"會想起以前類似場合的不自在，還沒到就先有點牴觸\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q22-e\",\"_type\":\"option\",\"text\":\"待久了情绪会变得比较烦躁，很想找理由早点离开\",\"textHant\":\"待久了情緒會變得比較煩躁，很想找理由早點離開\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q22-f\",\"_type\":\"option\",\"text\":\"会能拖就拖，尽量晚一点到、早一点走\",\"textHant\":\"會能拖就拖，儘量晚一點到、早一點走\",\"weights\":\"0,0,3,0,0,0\"}],\"section\":\"社交场合\",\"text\":\"参加一个聚会，如果大部分人我都不熟，我通常会怎么做？\",\"textHant\":\"參加一個聚會，如果大部分人我都不熟，我通常會怎麼做？\"},{\"_key\":\"q23\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q23-a\",\"_type\":\"option\",\"text\":\"会开始担心对方是不是不喜欢我、觉得我很奇怪\",\"textHant\":\"會開始擔心對方是不是不喜歡我、覺得我很奇怪\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q23-b\",\"_type\":\"option\",\"text\":\"会觉得没回复大概率是因为自己哪里不够好\",\"textHant\":\"會覺得沒回復大概率是因爲自己哪裏不夠好\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q23-c\",\"_type\":\"option\",\"text\":\"会想起以前被人已读不回的经历，心里更不是滋味\",\"textHant\":\"會想起以前被人已讀不回的經歷，心裏更不是滋味\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q23-d\",\"_type\":\"option\",\"text\":\"等待的过程情绪会有点烦躁不安\",\"textHant\":\"等待的過程情緒會有點煩躁不安\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q23-e\",\"_type\":\"option\",\"text\":\"会想着\\\"等他回了我再回\\\"，暂时先不管这件事\",\"textHant\":\"會想着\\\"等他回了我再回\\\"，暫時先不管這件事\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q23-f\",\"_type\":\"option\",\"text\":\"会反复琢磨自己发的那条消息是不是措辞不够得体\",\"textHant\":\"會反覆琢磨自己發的那條消息是不是措辭不夠得體\",\"weights\":\"0,0,0,3,0,0\"}],\"section\":\"社交场合\",\"text\":\"发消息给不太熟的人，对方很久没有回复，我通常会怎么想？\",\"textHant\":\"發消息給不太熟的人，對方很久沒有回覆，我通常會怎麼想？\"},{\"_key\":\"q24\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q24-a\",\"_type\":\"option\",\"text\":\"如果被反驳了，会立刻觉得自己这个人不太行\",\"textHant\":\"如果被反駁了，會立刻覺得自己這個人不太行\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q24-b\",\"_type\":\"option\",\"text\":\"会想起以前表达不同意见被人反驳的经历，更不敢开口\",\"textHant\":\"會想起以前表達不同意見被人反駁的經歷，更不敢開口\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q24-c\",\"_type\":\"option\",\"text\":\"开口前会明显感到紧张，说话时语速可能不自觉变快\",\"textHant\":\"開口前會明顯感到緊張，說話時語速可能不自覺變快\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q24-d\",\"_type\":\"option\",\"text\":\"会先观察别人的反应，能不说就先不说\",\"textHant\":\"會先觀察別人的反應，能不說就先不說\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q24-e\",\"_type\":\"option\",\"text\":\"会反复斟酌措辞，怕表达得不够到位让人觉得没道理\",\"textHant\":\"會反覆斟酌措辭，怕表達得不夠到位讓人覺得沒道理\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q24-f\",\"_type\":\"option\",\"text\":\"最在意的是别人会不会因为这个意见对我有负面看法\",\"textHant\":\"最在意的是別人會不會因爲這個意見對我有負面看法\",\"weights\":\"0,0,0,0,3,0\"}],\"section\":\"社交场合\",\"text\":\"需要在小组里主动表达一个跟大家不一样的意见，我通常会？\",\"textHant\":\"需要在小組裏主動表達一個跟大家不一樣的意見，我通常會？\"},{\"_key\":\"q25\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q25-a\",\"_type\":\"option\",\"text\":\"会不自觉拿这次跟以前融入不顺利的经历比较\",\"textHant\":\"會不自覺拿這次跟以前融入不順利的經歷比較\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q25-b\",\"_type\":\"option\",\"text\":\"这段时间情绪会比平时更容易波动\",\"textHant\":\"這段時間情緒會比平時更容易波動\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q25-c\",\"_type\":\"option\",\"text\":\"会想着\\\"等熟悉一点再主动融入\\\"，先观望着\",\"textHant\":\"會想着\\\"等熟悉一點再主動融入\\\"，先觀望着\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q25-d\",\"_type\":\"option\",\"text\":\"会因为还没有完全融入而觉得自己表现得不够好\",\"textHant\":\"會因爲還沒有完全融入而覺得自己表現得不夠好\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q25-e\",\"_type\":\"option\",\"text\":\"大部分精力都花在担心别人对我的第一印象上\",\"textHant\":\"大部分精力都花在擔心別人對我的第一印象上\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q25-f\",\"_type\":\"option\",\"text\":\"会觉得融入得慢，多少说明自己这方面能力不行\",\"textHant\":\"會覺得融入得慢，多少說明自己這方面能力不行\",\"weights\":\"0,0,0,0,0,3\"}],\"section\":\"社交场合\",\"text\":\"在陌生环境里（比如新公司、新班级）待了几周，我通常是什么感受？\",\"textHant\":\"在陌生環境裏（比如新公司、新班級）待了幾周，我通常是什麼感受？\"},{\"_key\":\"q26\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q26-a\",\"_type\":\"option\",\"text\":\"想起某些事情时情绪还是会比较激动\",\"textHant\":\"想起某些事情時情緒還是會比較激動\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q26-b\",\"_type\":\"option\",\"text\":\"会觉得\\\"有些事一直拖着没处理\\\"，心里有点不安\",\"textHant\":\"會覺得\\\"有些事一直拖着沒處理\\\"，心裏有點不安\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q26-c\",\"_type\":\"option\",\"text\":\"会觉得自己本可以做得更好，但当时没做到\",\"textHant\":\"會覺得自己本可以做得更好，但當時沒做到\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q26-d\",\"_type\":\"option\",\"text\":\"会比较在意这一年里别人是怎么评价自己的\",\"textHant\":\"會比較在意這一年裏別人是怎麼評價自己的\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q26-e\",\"_type\":\"option\",\"text\":\"整体基调偏向\\\"我这一年还是不够好\\\"\",\"textHant\":\"整體基調偏向\\\"我這一年還是不夠好\\\"\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q26-f\",\"_type\":\"option\",\"text\":\"容易只记得那些没做好的事，好的部分反而想不太起来\",\"textHant\":\"容易只記得那些沒做好的事，好的部分反而想不太起來\",\"weights\":\"3,0,0,0,0,0\"}],\"section\":\"自我评价\",\"text\":\"回顾自己过去一年的表现，我心里的整体感受通常是？\",\"textHant\":\"回顧自己過去一年的表現，我心裏的整體感受通常是？\"},{\"_key\":\"q27\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q27-a\",\"_type\":\"option\",\"text\":\"会想着\\\"以后再认真写\\\"，一直没真正动手\",\"textHant\":\"會想着\\\"以後再認真寫\\\"，一直沒真正動手\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q27-b\",\"_type\":\"option\",\"text\":\"会反复修改用词，怕写得不够客观、不够到位\",\"textHant\":\"會反覆修改用詞，怕寫得不夠客觀、不夠到位\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q27-c\",\"_type\":\"option\",\"text\":\"会很在意别人读完之后会怎么看这个\\\"我\\\"\",\"textHant\":\"會很在意別人讀完之後會怎麼看這個\\\"我\\\"\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q27-d\",\"_type\":\"option\",\"text\":\"基调会偏向列举自己的不足，而不是长处\",\"textHant\":\"基調會偏向列舉自己的不足，而不是長處\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q27-e\",\"_type\":\"option\",\"text\":\"不自觉先想到那些让我不满意的经历，很难先写优点\",\"textHant\":\"不自覺先想到那些讓我不滿意的經歷，很難先寫優點\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q27-f\",\"_type\":\"option\",\"text\":\"写的时候情绪会比较复杂，容易带一点烦躁或低落\",\"textHant\":\"寫的時候情緒會比較複雜，容易帶一點煩躁或低落\",\"weights\":\"0,3,0,0,0,0\"}],\"section\":\"自我评价\",\"text\":\"如果要写一段\\\"介绍我自己\\\"的文字，我通常会更倾向于？\",\"textHant\":\"如果要寫一段\\\"介紹我自己\\\"的文字，我通常會更傾向於？\"},{\"_key\":\"q28\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q28-a\",\"_type\":\"option\",\"text\":\"我对自己的要求，明显比大多数人对我的要求更高\",\"textHant\":\"我對自己的要求，明顯比大多數人對我的要求更高\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q28-b\",\"_type\":\"option\",\"text\":\"我对自己的评价很大程度上取决于我猜别人是怎么看我的\",\"textHant\":\"我對自己的評價很大程度上取決於我猜別人是怎麼看我的\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q28-c\",\"_type\":\"option\",\"text\":\"我对自己的评价，几乎总是比别人给我的评价更差\",\"textHant\":\"我對自己的評價，幾乎總是比別人給我的評價更差\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q28-d\",\"_type\":\"option\",\"text\":\"别人的评价通常没那么苛刻，但我总还是想起自己过去的失误\",\"textHant\":\"別人的評價通常沒那麼苛刻，但我總還是想起自己過去的失誤\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q28-e\",\"_type\":\"option\",\"text\":\"被别人指出问题的时候，我的情绪反应通常比对方预期的更大\",\"textHant\":\"被別人指出問題的時候，我的情緒反應通常比對方預期的更大\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q28-f\",\"_type\":\"option\",\"text\":\"我对自己有很多\\\"应该改\\\"的地方，但实际去改的很少\",\"textHant\":\"我對自己有很多\\\"應該改\\\"的地方，但實際去改的很少\",\"weights\":\"0,0,3,0,0,0\"}],\"section\":\"自我评价\",\"text\":\"身边人给我的评价，跟我对自己的评价，通常哪个更严格？\",\"textHant\":\"身邊人給我的評價，跟我對自己的評價，通常哪個更嚴格？\"},{\"_key\":\"q29\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q29-a\",\"_type\":\"option\",\"text\":\"会不自觉去想别人是不是在议论我、评价我\",\"textHant\":\"會不自覺去想別人是不是在議論我、評價我\",\"weights\":\"0,0,0,0,3,0\"},{\"_key\":\"q29-b\",\"_type\":\"option\",\"text\":\"整体基调偏负面，很少有\\\"我今天做得还不错\\\"这种念头\",\"textHant\":\"整體基調偏負面，很少有\\\"我今天做得還不錯\\\"這種念頭\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q29-c\",\"_type\":\"option\",\"text\":\"经常是过去某次没处理好的事，一遍遍在脑海里重播\",\"textHant\":\"經常是過去某次沒處理好的事，一遍遍在腦海裏重播\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q29-d\",\"_type\":\"option\",\"text\":\"有时会突然情绪低落或烦躁，自己也说不清具体原因\",\"textHant\":\"有時會突然情緒低落或煩躁，自己也說不清具體原因\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q29-e\",\"_type\":\"option\",\"text\":\"会想起一堆\\\"该做但还没做\\\"的事，心里有点乱但不会马上动手\",\"textHant\":\"會想起一堆\\\"該做但還沒做\\\"的事，心裏有點亂但不會馬上動手\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q29-f\",\"_type\":\"option\",\"text\":\"会想着\\\"这也没做好、那也可以更好\\\"，很难安静地肯定自己\",\"textHant\":\"會想着\\\"這也沒做好、那也可以更好\\\"，很難安靜地肯定自己\",\"weights\":\"0,0,0,3,0,0\"}],\"section\":\"自我评价\",\"text\":\"独自一人、没有别人打扰的时候，我脑子里冒出来的关于自己的念头，整体基调通常是？\",\"textHant\":\"獨自一人、沒有別人打擾的時候，我腦子裏冒出來的關於自己的念頭，整體基調通常是？\"},{\"_key\":\"q30\",\"_type\":\"question\",\"isDeepOnly\":false,\"options\":[{\"_key\":\"q30-a\",\"_type\":\"option\",\"text\":\"可能会想对自己说话温和一点，但改掉习惯性的自我批评需要时间\",\"textHant\":\"可能會想對自己說話溫和一點，但改掉習慣性的自我批評需要時間\",\"weights\":\"0,0,0,0,0,3\"},{\"_key\":\"q30-b\",\"_type\":\"option\",\"text\":\"可能会想试着不那么害怕失败，但真遇到时估计还是会难受一阵\",\"textHant\":\"可能會想試着不那麼害怕失敗，但真遇到時估計還是會難受一陣\",\"weights\":\"3,0,0,0,0,0\"},{\"_key\":\"q30-c\",\"_type\":\"option\",\"text\":\"可能会想学着更平稳地处理情绪，但具体怎么做还没想清楚\",\"textHant\":\"可能會想學着更平穩地處理情緒，但具體怎麼做還沒想清楚\",\"weights\":\"0,3,0,0,0,0\"},{\"_key\":\"q30-d\",\"_type\":\"option\",\"text\":\"可能会想少拖延一点，但开始时估计还是会习惯性往后推\",\"textHant\":\"可能會想少拖延一點，但開始時估計還是會習慣性往後推\",\"weights\":\"0,0,3,0,0,0\"},{\"_key\":\"q30-e\",\"_type\":\"option\",\"text\":\"可能会想对自己宽松一点，但真正放下\\\"必须做好\\\"估计需要时间\",\"textHant\":\"可能會想對自己寬鬆一點，但真正放下\\\"必須做好\\\"估計需要時間\",\"weights\":\"0,0,0,3,0,0\"},{\"_key\":\"q30-f\",\"_type\":\"option\",\"text\":\"可能会想不那么在意别人的看法，但做起来估计没那么容易\",\"textHant\":\"可能會想不那麼在意別人的看法，但做起來估計沒那麼容易\",\"weights\":\"0,0,0,0,3,0\"}],\"section\":\"自我评价\",\"text\":\"完成这次测试后，如果结果显示我某方面确实存在明显的心理负担，我预期自己接下来会？\",\"textHant\":\"完成這次測試後，如果結果顯示我某方面確實存在明顯的心理負擔，我預期自己接下來會？\"}],\"resultProfiles\":[{\"_key\":\"rp-01\",\"_type\":\"resultProfile\",\"deepDescription\":\"难以面对失败，往往不是因为失败本身有多严重，而是因为失败被赋予了远超\\\"这件事没做好\\\"的意义——很多人会不自觉地把一次具体的失误，等同于\\\"我这个人不行\\\"的整体判断，这种从\\\"事\\\"到\\\"人\\\"的跳跃，才是让失败久久无法翻篇的真正原因。\\n\\n这种模式的代价是持续的：每一次失败都被反复咀嚼，情绪能量被大量消耗在\\\"为什么会这样\\\"的自我审判上，而不是\\\"接下来该怎么办\\\"的实际行动上，长期下来会让人对尝试新事物越来越谨慎，因为潜意识里害怕再一次经历这种漫长的自我否定。\\n\\n一个可操作的起点：下次搞砸事情时，试着区分\\\"这件事哪里没做好\\\"和\\\"我这个人怎么样\\\"，只允许自己回答第一个问题，第二个问题直接跳过。建议同时关注自我否定维度，这两者往往互相强化。\",\"description\":\"我在这次测试里表现出比较明显的失败不耐受——遇到失误或挫败时，我很难做到\\\"复盘完就放下\\\"，负面感受往往会在心里停留很长时间，反复被唤起。\\n\\n（本测试为自我觉察工具，不是心理诊断，如果这些感受已经明显影响到日常生活，建议寻求专业心理咨询支持。）\",\"profileId\":\"failure-intolerance-high\",\"subtitle\":\"搞砸一件事之后，我常常需要很久才能真正翻篇\",\"title\":\"难以面对失败者\",\"titleHant\":\"難以面對失敗者\",\"triggerDimensions\":\"failure_intolerance-high\",\"youtubeLinks\":[]},{\"_key\":\"rp-02\",\"_type\":\"resultProfile\",\"deepDescription\":\"能够快速从失败中恢复，核心在于能把\\\"事\\\"和\\\"人\\\"分得比较开——一次具体的失误被看作信息，而不是对自我价值的整体判决，这种区分能力通常来自过去反复的练习：失败过很多次，也确认了失败并不等于自己变得不值得被认可。\\n\\n这种能力的现实价值在于，它让一个人能够持续尝试有风险的事情——因为知道即使失败了，代价也是可控且短暂的，不会陷入长期的情绪泥潭，这直接影响一个人愿不愿意持续挑战自己的能力边界。\\n\\n这种能力也需要边界：完全不为失败停留，有时会错过真正值得反思的教训。健康的状态是\\\"快速消化情绪，但认真提取教训\\\"。建议同时关注完美主义维度——对失败的宽容度，和对过程的完美要求经常互相影响。\",\"description\":\"我在这次测试里表现出比较低的失败不耐受——遇到失误或挫败时，我能够相对快速地完成\\\"发生了什么、下次怎么办\\\"的复盘，不会长期困在负面情绪里。\",\"profileId\":\"failure-resilient-low\",\"subtitle\":\"搞砸一件事之后，我大体上能复盘完就翻篇\",\"title\":\"失败复原者\",\"titleHant\":\"失敗復原者\",\"triggerDimensions\":\"failure_intolerance-low\",\"youtubeLinks\":[]},{\"_key\":\"rp-03\",\"_type\":\"resultProfile\",\"deepDescription\":\"情绪容易被点燃，通常不是因为\\\"情绪本身有问题\\\"，而是因为从感受出现到行为反应之间的那段缓冲空间太短——很多人在情绪升起的那一刻，几乎是同步就做出了反应，中间没有一个\\\"我先感受到了，但我可以选择怎么回应\\\"的间隔。\\n\\n这种模式的代价往往出现在事后：情绪当下宣泄出来会带来短暂的释放感，但随之而来的常常是后悔、需要修复关系的额外成本，长期下来会让身边人在跟自己相处时也变得更谨慎小心。\\n\\n一个可操作的练习：在情绪明显上涌的那一刻，给自己一个固定的物理动作（比如深呼吸三次、离开现场走两分钟），人为地把\\\"感受到\\\"和\\\"做出反应\\\"这两步分开，哪怕只多出十几秒的间隔，也能显著改变最终的反应方式。建议同时关注自我否定维度，事后的自我批评往往会加重下一次情绪失控的强度。\",\"description\":\"我在这次测试里表现出比较明显的情绪波动倾向——面对压力、冲突或意外状况时，我更容易被情绪快速带走，事后往往会觉得当时的反应超出了自己本来想要的程度。\\n\\n（本测试为自我觉察工具，不是心理诊断，如果情绪失控已经明显影响到工作或关系，建议寻求专业心理咨询支持。）\",\"profileId\":\"emotional-volatile-high\",\"subtitle\":\"遇到压力或刺激时，我的情绪反应经常比自己预期的更大\",\"title\":\"情绪容易失控者\",\"titleHant\":\"情緒容易失控者\",\"triggerDimensions\":\"emotional_volatility-high\",\"youtubeLinks\":[]},{\"_key\":\"rp-04\",\"_type\":\"resultProfile\",\"deepDescription\":\"情绪稳定不代表感受不到强烈的情绪，而是拥有更长的\\\"感受到反应\\\"缓冲空间——知道自己在生气、焦虑或委屈，但依然能够先完成基本的判断，再决定要不要表达、怎么表达，这种能力通常是长期练习出来的，而不是天生迟钝。\\n\\n这种能力的价值体现在关系和工作里都很明显——身边人会更愿意跟一个情绪稳定的人沟通，因为不需要时刻担心一句话会不会引爆对方，这也让稳定情绪的人本身更容易获得别人的信任和坦诚反馈。\\n\\n这种稳定性也需要警惕：如果稳定的代价是长期压抑真实感受，同样会带来问题。健康的稳定，是\\\"能感受、能表达，只是不被情绪牵着走\\\"，而不是麻木。建议同时关注自我否定维度——过度压抑的稳定，有时会以自我攻击的形式在内部释放出来。\",\"description\":\"我在这次测试里表现出比较低的情绪波动倾向——面对压力或冲突时，我能够比较好地维持理智，不容易被瞬间的情绪反应主导自己的行为。\",\"profileId\":\"emotional-stable-low\",\"subtitle\":\"遇到压力或刺激时，我大体上能维持基本的理智和平稳\",\"title\":\"情绪较稳定者\",\"titleHant\":\"情緒較穩定者\",\"triggerDimensions\":\"emotional_volatility-low\",\"youtubeLinks\":[]},{\"_key\":\"rp-05\",\"_type\":\"resultProfile\",\"deepDescription\":\"拖延很少是单纯的\\\"懒\\\"，更常见的原因是把\\\"开始做\\\"和\\\"必须做好\\\"绑在了一起——一旦一件事被赋予了\\\"必须做得很好\\\"的压力，开始这个动作本身就会变得沉重，于是大脑会本能地寻找各种理由推迟这个有压力的时刻。\\n\\n拖延带来的代价是双重的：一方面是最终完成质量常常因为时间不足而打折扣，另一方面是拖延期间那种\\\"我知道该做但一直没做\\\"的隐性焦虑，其实比真正投入去做还要消耗心理能量，只是这种消耗不容易被直接察觉。\\n\\n一个可操作的起点：不要求自己\\\"开始就要做好\\\"，而是给自己设一个极低门槛的开始动作（比如只写第一句话、只打开文件），把\\\"开始\\\"和\\\"做完\\\"彻底分离，往往一旦真正开始，后续的推进会比想象中容易。建议同时关注完美主义维度，拖延和过高的自我要求经常是同一枚硬币的两面。\",\"description\":\"我在这次测试里表现出比较明显的拖延倾向——面对任务时，我更容易把开始的时间一再往后推，常常要等到截止日期逼近，才被迫真正投入行动。\",\"profileId\":\"procrastination-high\",\"subtitle\":\"面对需要完成的任务，我经常一拖再拖，直到最后一刻才动手\",\"title\":\"习惯性拖延者\",\"titleHant\":\"習慣性拖延者\",\"triggerDimensions\":\"procrastination-high\",\"youtubeLinks\":[]},{\"_key\":\"rp-06\",\"_type\":\"resultProfile\",\"deepDescription\":\"愿意尽早开始，核心在于能把\\\"开始\\\"和\\\"做到完美\\\"分开看待——知道第一步往往是粗糙的、不完整的，但依然愿意先迈出去，剩下的部分留给后续的迭代和修正，这种心态让行动的门槛大大降低。\\n\\n这种习惯的价值很直接：任务分散在更长的时间里推进，意味着每个阶段的压力都更可控，也留出了处理意外情况的余地，而不是把所有风险都压缩在截止日期前的最后一段时间。\\n\\n这种习惯也需要注意节奏：一味求快有时会牺牲深思熟虑的质量。健康的\\\"说做就做\\\"，是快速启动、但依然给关键节点留出思考的空间，而不是为了行动而行动。建议同时关注自我管理相关的表现——尽早开始只是第一步，能不能持续推进同样重要。\",\"description\":\"我在这次测试里表现出比较低的拖延倾向——面对任务时，我更愿意尽早启动，而不是把压力留到最后一刻才集中处理。\",\"profileId\":\"action-oriented-low\",\"subtitle\":\"面对需要完成的任务，我倾向于尽早开始，不太喜欢拖着\",\"title\":\"说做就做者\",\"titleHant\":\"說做就做者\",\"triggerDimensions\":\"procrastination-low\",\"youtubeLinks\":[]},{\"_key\":\"rp-07\",\"_type\":\"resultProfile\",\"deepDescription\":\"完美主义常常被误认为是\\\"追求卓越\\\"，但两者的核心区别在于：追求卓越的人在达到一个好的结果后能感到满足，而完美主义者即使结果很好，注意力也会立刻转向那些还不够好的细节，满足感很少真正出现，这也是为什么完美主义常常伴随着持续的疲惫和不安。\\n\\n这种模式的代价不仅是时间成本，更是一种持续的自我压力——任何一次\\\"没做到最好\\\"都会被内心解读为一次失败，久而久之，这种标准会让做事本身变成一件充满焦虑而非成就感的事情，也会让人不敢轻易开始那些\\\"可能做不好\\\"的新尝试。\\n\\n一个可操作的练习：为不同重要程度的任务预先设定不同的\\\"完成标准\\\"（比如日常沟通用简单版本、真正重要的项目才投入到极致），把\\\"完美\\\"这个稀缺资源留给真正值得的场合，而不是均匀撒在所有事情上。建议同时关注拖延维度，对完美的执着经常是拖延真正的心理根源。\",\"description\":\"我在这次测试里表现出比较明显的完美主义倾向——做事时，我很难接受\\\"够用就好\\\"的标准，常常要达到自己心里那条很高的线才肯罢手，即使这意味着要付出更多时间和精力。\",\"profileId\":\"perfectionism-high\",\"subtitle\":\"我很难对自己说\\\"这次做到这样就够了\\\"\",\"title\":\"苛求完美者\",\"titleHant\":\"苛求完美者\",\"triggerDimensions\":\"perfectionism-high\",\"youtubeLinks\":[]},{\"_key\":\"rp-08\",\"_type\":\"resultProfile\",\"deepDescription\":\"能够接受\\\"够好\\\"，核心是拥有一套动态的、根据情境调整的标准——知道不是所有事情都值得投入同等的精力，重要的事认真对待，次要的事快速完成，这种取舍能力让整体的精力分配更加高效。\\n\\n这种能力的价值体现在长期的可持续性上——不会因为对每件小事都追求极致而提早耗尽精力，也更容易维持稳定、可持续的产出节奏，而不是在\\\"极致投入\\\"和\\\"精疲力竭\\\"之间反复摆荡。\\n\\n这种状态也需要一定的敏感度：某些真正重要的场合，依然值得投入更高的标准。健康的\\\"够好主义\\\"，是有意识地区分场合，而不是对所有事情都统一降低要求。建议同时关注失败不耐受维度——能接受\\\"够好\\\"的人，通常也更容易接受\\\"结果不完美但依然可以接受\\\"。\",\"description\":\"我在这次测试里表现出比较低的完美主义倾向——做事时，我能够比较容易地判断什么程度算\\\"足够好\\\"，不会执着于把每一件事都做到极致。\",\"profileId\":\"good-enough-low\",\"subtitle\":\"我大体上能接受\\\"这次做到这样已经够好了\\\"\",\"title\":\"接受\\\"够好\\\"者\",\"titleHant\":\"接受\\\"夠好\\\"者\",\"triggerDimensions\":\"perfectionism-low\",\"youtubeLinks\":[]},{\"_key\":\"rp-09\",\"_type\":\"resultProfile\",\"deepDescription\":\"社交焦虑的核心，往往不是\\\"不擅长社交技巧\\\"，而是把注意力过度放在了\\\"别人会怎么评价我\\\"这件事上——大脑在整个社交过程中同时运行着两套程序，一套用来实际互动，另一套用来实时监控和评估自己的表现，后者消耗了大量本该用于放松交流的心理资源。\\n\\n这种模式的代价是，社交本身从一种自然的互动，变成了一场持续的自我审视，即使当下互动其实很顺利，事后依然会不受控制地反复回放，寻找那些\\\"可能被扣分\\\"的细节，这种反刍往往比社交本身更消耗人。\\n\\n一个可操作的练习：进入社交场合前，给自己设定一个具体的、朝外的小目标（比如\\\"了解对方一件事\\\"），而不是模糊的\\\"表现好一点\\\"，把注意力从自我监控转移到真实的互动内容上，能明显降低焦虑感。建议同时关注自我否定维度，事后的反复回想经常是自我批评的另一种表现形式。\",\"description\":\"我在这次测试里表现出比较明显的社交焦虑——在需要与人互动的场合，我更容易感到紧张不安，事前会担心表现不好，事后又容易反复回想自己有没有说错话、做错事。\\n\\n（本测试为自我觉察工具，不是心理诊断，如果社交焦虑已经明显影响到日常生活，建议寻求专业心理咨询支持。）\",\"profileId\":\"social-anxiety-high\",\"subtitle\":\"需要跟人打交道的场合，我常常会提前紧张、事后反复回想\",\"title\":\"社交焦虑者\",\"titleHant\":\"社交焦慮者\",\"triggerDimensions\":\"social_anxiety-high\",\"youtubeLinks\":[]},{\"_key\":\"rp-10\",\"_type\":\"resultProfile\",\"deepDescription\":\"社交放松的核心，是能把注意力主要放在互动本身，而不是持续监控自己的表现——这种状态往往来自过去积累的经验：尝试过表达真实的自己，也确认了这样做不会带来灾难性的后果，久而久之，对社交场合的默认预期就变得更宽松。\\n\\n这种能力的价值在于，它让社交成为一种消耗更低、甚至能带来能量的活动，而不是需要提前准备、事后恢复的负担，这也让一个人更愿意主动拓展社交圈子和尝试新的互动场合。\\n\\n这种放松也需要一定的自我觉察：完全不在意别人的反应，有时会错过真正有价值的社交反馈。健康的放松，是\\\"关心但不过度监控\\\"。建议同时关注表达相关的能力——放松的状态是良好沟通的基础，但表达本身依然需要练习。\",\"description\":\"我在这次测试里表现出比较低的社交焦虑——在与人互动的场合，我能够比较自然地保持放松，不会过度担心自己的表现或事后反复回想细节。\",\"profileId\":\"social-relaxed-low\",\"subtitle\":\"需要跟人打交道的场合，我大体上能保持自然放松\",\"title\":\"社交放松者\",\"titleHant\":\"社交放鬆者\",\"triggerDimensions\":\"social_anxiety-low\",\"youtubeLinks\":[]},{\"_key\":\"rp-11\",\"_type\":\"resultProfile\",\"deepDescription\":\"习惯性的自我否定，常常被误以为是\\\"高标准、严要求\\\"，是一种促使自己进步的动力，但研究和大量实践观察都指向相反的结论——持续的自我攻击更容易导致回避和拖延，而不是真正的改进，因为大脑在感受到威胁（哪怕威胁来自自己）时，本能反应是防御和逃避，而不是学习。\\n\\n这种模式的代价是隐性但深远的：内心那个苛刻的声音会逐渐扩大适用范围，从\\\"这件事没做好\\\"蔓延到\\\"我这个人不够好\\\"，长期下来会持续消耗一个人的自我价值感和行动意愿，即使外在表现依然不错，内在体验也会长期处于紧绷和不满意的状态。\\n\\n一个可操作的起点：留意自己内心批评的语气，试着把对自己说的话，换成\\\"如果是我很在乎的朋友遇到同样的事，我会怎么和他说\\\"，用这个标准替换掉习惯性的苛刻自我对话。建议同时关注难以面对失败维度，两者往往互为因果、互相强化。\",\"description\":\"我在这次测试里表现出比较明显的自我否定倾向——面对自己的不足或失误，我更容易用严厉、苛刻的方式在内心评价自己，而不是相对客观、宽容地看待。\\n\\n（本测试为自我觉察工具，不是心理诊断，如果自我否定已经明显影响到情绪和生活，建议寻求专业心理咨询支持。）\",\"profileId\":\"self-critical-high\",\"subtitle\":\"对自己做得不够好的地方，我习惯用很苛刻的话在心里数落自己\",\"title\":\"习惯自我否定者\",\"titleHant\":\"習慣自我否定者\",\"triggerDimensions\":\"self_criticism-high\",\"youtubeLinks\":[]},{\"_key\":\"rp-12\",\"_type\":\"resultProfile\",\"deepDescription\":\"自我宽容不等于对自己没有要求，而是能把\\\"对事情的高标准\\\"和\\\"对自我价值的评判\\\"分开——认可自己这件事没做好，同时依然相信自己作为一个人是值得被善待的，这两者可以同时成立，并不矛盾。\\n\\n这种能力的价值在于，它让一个人能够更持续地投入需要反复尝试的事情——因为失败之后不会伴随剧烈的自我攻击，尝试的心理成本更低，也更容易在挫折之后重新振作，而不是被自我否定拖入更长时间的低谷。\\n\\n这种宽容也需要真实的自我觉察作为基础：完全不做自我审视的宽容，容易变成回避成长。健康的自我宽容，是\\\"温和地看见问题，同时依然善待自己\\\"。建议同时关注失败不耐受维度——两者经常相辅相成，共同决定一个人从挫折中恢复的速度。\",\"description\":\"我在这次测试里表现出比较低的自我否定倾向——面对自己的不足，我能够比较客观、不苛刻地看待，不会习惯性地陷入严厉的自我批评。\",\"profileId\":\"self-compassionate-low\",\"subtitle\":\"对自己做得不够好的地方，我大体上能相对客观、宽容地看待\",\"title\":\"自我宽容者\",\"titleHant\":\"自我寬容者\",\"triggerDimensions\":\"self_criticism-low\",\"youtubeLinks\":[]}],\"slug\":\"psych-common-issues-test\",\"tagline\":\"30道题，照出我在面对失败、情绪、拖延、完美主义、社交、自我评价这几件事上的真实状态（自我觉察工具，非诊断）\",\"title\":\"我还有哪些没察觉的心理负担？\",\"titleHant\":\"我還有哪些沒察覺的心理負擔？\",\"totalQuestions\":30}}]\n"])
